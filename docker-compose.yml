services:
  db:
    image: pgvector/pgvector:pg16
    container_name: obsiagent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: obsi
      POSTGRES_PASSWORD: obsi
      POSTGRES_DB: obsiagent
    ports:
      # Publicado solo en localhost: la app (en el host) se conecta por 127.0.0.1
      # y Postgres NO queda expuesto a Internet (Docker se salta ufw).
      - "127.0.0.1:5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsi -d obsiagent"]
      interval: 5s
      timeout: 5s
      retries: 10

