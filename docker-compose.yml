services:
  # ─── App Next.js (obsiAgent) ───────────────────────────────────────────
  app:
    build:
      context: .
    container_name: obsiagent-app
    restart: unless-stopped
    # Lee ANTHROPIC_API_KEY, VOYAGE_API_KEY, EVOLUTION_*, APP_DOMAIN, etc. del .env
    env_file:
      - .env
    environment:
      # Dentro de la red Docker, Postgres se alcanza por el nombre del servicio "db"
      # (NO localhost). Esto sobreescribe el DATABASE_URL del .env.
      DATABASE_URL: postgres://obsi:obsi@db:5432/obsiagent
      OBSIDIAN_VAULT_PATH: /data/vault
    volumes:
      - vault:/data/vault           # vault persistente (las notas .md viven aquí)
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend                     # red privada para hablar con la DB
    labels:
      # ── Traefik existente del VPS (corre en red host, certresolver "letsencrypt") ──
      # Traefik descubre este contenedor por estas etiquetas y le emite HTTPS.
      # APP_DOMAIN se define en .env, p.ej. APP_DOMAIN=obsiagent.iagent.mx
      - traefik.enable=true
      - traefik.http.routers.obsiagent.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.obsiagent.entrypoints=websecure
      - traefik.http.routers.obsiagent.tls.certresolver=letsencrypt
      - traefik.http.services.obsiagent.loadbalancer.server.port=3000

  # ─── Base de datos (Postgres + pgvector) ───────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: obsiagent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: obsi
      POSTGRES_PASSWORD: obsi
      POSTGRES_DB: obsiagent
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Aplica el esquema (extensión vector + tablas + índices) en el PRIMER
      # arranque, cuando el volumen está vacío. Sustituye a `npm run migrate`.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsi -d obsiagent"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend                     # solo red privada: NO expuesta a Internet

volumes:
  pgdata:
  vault:

networks:
  backend:
