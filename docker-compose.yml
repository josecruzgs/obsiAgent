services:
  # ─── App Next.js (obsiAgent) ───────────────────────────────────────────
  app:
    build:
      context: .
    container_name: obsiagent-app
    restart: unless-stopped
    # Lee ANTHROPIC_API_KEY, VOYAGE_API_KEY, EVOLUTION_*, etc. del .env
    env_file:
      - .env
    environment:
      # Dentro de la red Docker, Postgres se alcanza por el nombre del servicio "db"
      # (NO localhost). Esto sobreescribe el DATABASE_URL del .env.
      DATABASE_URL: postgres://obsi:obsi@db:5432/obsiagent
      OBSIDIAN_VAULT_PATH: /data/vault
    ports:
      # Publicado SOLO en localhost del host: nginx (host) hará proxy_pass aquí.
      - "127.0.0.1:3001:3000"
    volumes:
      # Vault en una CARPETA del host: súbele notas por SFTP/scp/git y persiste.
      - /srv/obsiagent/vault:/data/vault
      # Bandeja de entrada para importación masiva (/api/bulk-import).
      - /srv/obsiagent/inbox:/data/inbox
    depends_on:
      db:
        condition: service_healthy
    # Permite alcanzar servicios publicados en el HOST (p. ej. evolution-api en
    # :8085) desde este contenedor vía http://host.docker.internal:<puerto>.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend                     # red privada para hablar con la DB

  # ─── Base de datos (Postgres + pgvector) ───────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: obsiagent-db
    restart: unless-stopped
    ports:
      # Solo loopback del VPS (para túnel SSH desde tu PC). NO expuesto a Internet.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: obsi
      POSTGRES_PASSWORD: obsi
      POSTGRES_DB: obsiagent
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Aplica el esquema (extensión vector + tablas + índices) en el PRIMER
      # arranque, cuando el volumen está vacío. Sustituye a `npm run migrate`.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsi -d obsiagent"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend                     # solo red privada: NO expuesta a Internet

volumes:
  pgdata:

networks:
  backend:
